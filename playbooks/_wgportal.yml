---
- name: Purge wgportal role
  hosts: docker, !wgportal, !external
  strategy: host_pinned
  gather_facts: false
  become: true
  collections:
    - crrlcx.dockerized
  tasks:
    - name: Purge wgportal role
      ansible.builtin.include_role:
        name: crrlcx.dockerized.wgportal
        tasks_from: purge
