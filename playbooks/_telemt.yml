---
- name: Purge telemt role
  hosts: docker, !telemt, !external
  strategy: host_pinned
  gather_facts: false
  become: true
  collections:
    - crrlcx.dockerized
  tasks:
    - name: Purge telemt role
      ansible.builtin.include_role:
        name: crrlcx.dockerized.telemt
        tasks_from: purge
