---
- name: Create wgportal directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: docker
    mode: "0755"
  with_items:
    - "{{ wgportal_conf_dir }}"
    - "{{ wgportal_data_dir }}"

- name: Create wgportal config files
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ wgportal_conf_dir }}/{{ item | basename | regex_replace('.j2', '') }}"
    owner: root
    group: docker
    mode: "0644"
  loop:
    - docker-compose.yml.j2

- name: Docker Compose start containers
  community.docker.docker_compose_v2:
    project_src: "{{ wgportal_conf_dir }}"
    files:
      - docker-compose.yml
    state: "{{ wgportal_state }}"
    pull: "{{ wgportal_force_pull | ternary('always', 'policy') }}"
    recreate: "{{ wgportal_force_restart | ternary('always', 'auto') }}"
