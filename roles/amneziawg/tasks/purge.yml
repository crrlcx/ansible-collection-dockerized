---
- name: Docker Compose stop containers and remove images
  community.docker.docker_compose_v2:
    project_src: "{{ amneziawg_conf_dir }}"
    files:
      - docker-compose.yml
    state: absent
    remove_orphans: true
    remove_images: all
    renew_anon_volumes: true

- name: Purge amneziawg directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ amneziawg_conf_dir }}"
    - "{{ amneziawg_data_dir }}"
