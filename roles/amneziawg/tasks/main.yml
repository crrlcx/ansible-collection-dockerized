---
- name: Validate AmneziaWG mode
  ansible.builtin.assert:
    that:
      - amneziawg_mode in ['server', 'client', 'hub']
    fail_msg: "amneziawg_mode must be 'server', 'client', or 'hub'"

- name: Create amneziawg directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop:
    - path: "{{ amneziawg_conf_dir }}"
      owner: root
      group: docker
    - path: "{{ amneziawg_data_dir }}"
      owner: "{{ amneziawg_puid }}"
      group: "{{ amneziawg_pgid }}"
    - path: "{{ amneziawg_data_dir }}/wg_confs"
      owner: "{{ amneziawg_puid }}"
      group: "{{ amneziawg_pgid }}"

- name: Create amneziawg client configs
  ansible.builtin.include_tasks: client-configs.yml
  when: amneziawg_mode in ['client', 'hub']

- name: Create amneziawg hub script
  ansible.builtin.include_tasks: hub-script.yml
  when: amneziawg_mode == 'hub'

- name: Clean hub files from amneziawg server mode
  ansible.builtin.include_tasks: server-cleanup.yml
  when:
    - amneziawg_mode == 'server'
    - amneziawg_state == 'present'

- name: Create amneziawg hub config template
  ansible.builtin.include_tasks: server-config.yml
  when:
    - amneziawg_mode == 'hub'
    - amneziawg_state == 'present'

- name: Create amneziawg config files
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ amneziawg_conf_dir }}/docker-compose.yml"
    owner: root
    group: docker
    mode: "0644"

- name: Docker Compose start containers
  community.docker.docker_compose_v2:
    project_src: "{{ amneziawg_conf_dir }}"
    files:
      - docker-compose.yml
    state: "{{ amneziawg_state }}"
    pull: "{{ amneziawg_force_pull | ternary('always', 'policy') }}"
    recreate: >-
      {{
        (
          amneziawg_force_restart
          or (amneziawg_client_configs_result is defined and amneziawg_client_configs_result.changed)
          or (amneziawg_stale_client_configs_result is defined and amneziawg_stale_client_configs_result.changed)
          or (amneziawg_hub_failover_script_result is defined and amneziawg_hub_failover_script_result.changed)
          or (amneziawg_hub_failover_script_removal_result is defined and amneziawg_hub_failover_script_removal_result.changed)
          or (amneziawg_server_template_result is defined and amneziawg_server_template_result.changed)
          or (amneziawg_hub_server_config_removal_result is defined and amneziawg_hub_server_config_removal_result.changed)
        ) | ternary('always', 'auto')
      }}
